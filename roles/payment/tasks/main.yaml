-  name: app-setup
   ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yaml  

# change this as part of latest python3-devel from repos have upgraded openssl-libs but other openssl packages are old in AMI , so mismatching before installing python or after     
-  name: upgrading openssl packages
   ansible.builtin.dnf:
      name:
   state: latest
   loop: 
   - openssl
   - openssl-libs
   - openssh
   - openssh-server
   - openssh-clients

-  name: nodejs setup
   ansible.builtin.import_role:
    name: common
    tasks_from: python.yaml

-  name: setup systemd service
   ansible.builtin.import_role:
    name: common
    tasks_from: systemd.yaml